name: claude_remote
description: Mobile companion app for Claude Code sessions.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Crypto — pure Dart, no native dependencies
  cryptography: ^2.7.0

  # Storage
  flutter_secure_storage: ^10.0.0

  # Networking
  web_socket_channel: ^3.0.0

  # Discovery
  bonsoir: ^6.1.0

  # Connectivity state
  connectivity_plus: ^6.1.0

  # QR
  mobile_scanner: ^7.2.0

  # Navigation
  go_router: ^14.6.0

  # Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # UI
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
